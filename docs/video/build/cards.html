<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Regista demo graphics</title>
<!-- Title cards and overlays for the demo video (docs/video/build/make_video.py records them with
     web/scripts/capture.mjs). ?card=title|stack|close plays an animated card; ?sub=<text> and
     ?tag=<text> render a transparent overlay for the bottom band; ?frame=1 the background. -->
<style>
  @font-face { font-family: 'Barlow Condensed'; font-weight: 700; src: url('../../../web/public/fonts/barlow-condensed-700-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Barlow Condensed'; font-weight: 800; src: url('../../../web/public/fonts/barlow-condensed-800-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Barlow'; font-weight: 500; src: url('../../../web/public/fonts/barlow-500-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Barlow'; font-weight: 600; src: url('../../../web/public/fonts/barlow-600-latin.woff2') format('woff2'); }
  :root {
    --bg: #15181a; --panel: #1e2225; --text: #f2f5f3; --text-2: #9fb0a7; --brand: #7cf25c; --ink: #06110c; --ai: #46e5d8;
  }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body { font-family: 'Barlow', sans-serif; color: var(--text); }
  body.opaque {
    background: var(--bg);
    background-image: repeating-linear-gradient(90deg, rgb(255 255 255 / 0.018) 0 120px, transparent 120px 240px);
  }
  body.clear { background: transparent; }
  .display { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; text-transform: uppercase; line-height: 0.92; }
  .mark { display: inline-block; width: 1em; height: 0.82em; background: var(--brand); transform: skewX(-12deg); position: relative; }
  .mark::after { content: ''; position: absolute; left: 34%; top: 24%; border-left: 0.3em solid var(--ink); border-top: 0.2em solid transparent; border-bottom: 0.2em solid transparent; transform: skewX(12deg); }
  .wordmark { display: inline-flex; align-items: center; gap: 0.3em; letter-spacing: 0.06em; }
  .card { position: absolute; left: 160px; right: 160px; top: 0; height: 916px; display: flex; flex-direction: column; justify-content: center; }
  .rise { opacity: 0; transform: translateY(26px); animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .wipe { clip-path: inset(0 100% 0 0); animation: wipe 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  @keyframes wipe { to { clip-path: inset(0 0 0 0); } }
  .bar { height: 10px; width: 0; background: var(--brand); transform: skewX(-12deg); animation: grow 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  @keyframes grow { to { width: 220px; } }

  /* title */
  .t-name { font-size: 64px; }
  .t-line { font-size: 150px; margin-top: 18px; }
  .t-line.green { color: var(--brand); }
  .t-problem { max-width: 1180px; margin-top: 46px; font-size: 38px; line-height: 1.35; color: var(--text-2); }
  .t-problem b { color: var(--text); font-weight: 600; }

  /* stack */
  .s-head { font-size: 92px; margin: 18px 0 44px; }
  .s-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
  .s-tile { padding: 26px 26px 24px; background: var(--panel); border-top: 5px solid var(--brand); border-radius: 0 0 8px 8px; min-height: 120px; }
  .s-tile.ai { border-top-color: var(--ai); }
  .s-tile b { display: block; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 36px; text-transform: uppercase; line-height: 1; }
  .s-tile span { display: block; margin-top: 12px; font-size: 22px; color: var(--text-2); line-height: 1.3; }
  .eyebrow { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--brand); display: flex; align-items: center; gap: 16px; }
  .eyebrow::before { content: ''; width: 46px; height: 7px; background: var(--brand); transform: skewX(-12deg); }

  /* close */
  .c-name { font-size: 150px; }
  .c-tag { font-size: 64px; margin-top: 18px; }
  .c-tag span { color: var(--brand); }
  .c-links { margin-top: 56px; display: grid; gap: 18px; font-size: 36px; }
  .c-links div { display: flex; gap: 22px; align-items: baseline; }
  .c-links em { font-style: normal; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--brand); width: 120px; }
  .c-by { margin-top: 48px; font-size: 26px; color: var(--text-2); }

  /* bottom band overlays */
  .sub { position: absolute; left: 340px; right: 340px; top: 930px; height: 136px; display: flex; align-items: center; justify-content: center; text-align: center;
         font-size: 37px; font-weight: 500; line-height: 1.28; color: var(--text); text-shadow: 0 2px 8px rgb(0 0 0 / 0.6); }
  .tag { position: absolute; left: 186px; top: 872px; padding: 8px 18px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px;
         letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); background: var(--brand); transform: skewX(-12deg); }
  .tag.ai { background: var(--ai); }
  .tag span { display: inline-block; transform: skewX(12deg); }
  .brandmark { position: absolute; right: 160px; top: 956px; font-size: 30px; opacity: 0.85; }
</style>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search)
  const card = q.get('card'), sub = q.get('sub'), tag = q.get('tag')
  const mark = '<span class="mark"></span>'
  const html = (s) => { document.body.insertAdjacentHTML('beforeend', s) }
  const d = (s) => `style="animation-delay:${s}s"`
  document.body.className = card || q.get('frame') ? 'opaque' : 'clear'
  if (q.get('frame')) html(`<div class="brandmark display wordmark">${mark} Regista</div>`)
  if (card === 'title') html(`<div class="card">
      <div class="display wordmark t-name rise" ${d(0.2)}>${mark} Regista</div>
      <div class="bar" style="animation-delay:0.5s;margin-top:28px"></div>
      <div class="display t-line wipe" ${d(0.9)}>Reads the game.</div>
      <div class="display t-line green wipe" ${d(1.5)}>Directs the broadcast.</div>
      <div class="t-problem rise" ${d(4.2)}>Live match graphics and tactical analysis take a team of analysts, so <b>most matches never get them</b>.
        Regista generates them live, and <b>checks every number before it goes on air</b>.</div>
    </div>`)
  if (card === 'stack') {
    const T = [
      ['Microsoft Foundry', 'gpt-5.4-mini and gpt-5-mini for the six agents'],
      ['Microsoft Agent Framework', 'the agent workflow: Detector → Analyst ⇄ Verifier → writers'],
      ['Model Context Protocol', 'six typed metrics tools: the only way to a number'],
      ['Azure Container Apps', 'API, live streams and site in one container'],
      ['Azure Database for PostgreSQL', 'every agent run and verdict'],
      ['Azure Blob Storage', 'demo matches and recorded runs, managed identity'],
      ['Application Insights', 'OpenTelemetry traces per moment and agent call'],
      ['Azure AI Speech', 'the voice of this video', 'ai'],
    ]
    html(`<div class="card"><div class="eyebrow rise" ${d(0.1)}>Under the hood</div>
      <div class="display s-head rise" ${d(0.3)}>Built on Microsoft and Azure</div>
      <div class="s-grid">${T.map(([b, s, k], i) => `<div class="s-tile rise ${k ?? ''}" ${d(0.6 + i * 0.18)}><b>${b}</b><span>${s}</span></div>`).join('')}</div></div>`)
  }
  if (card === 'close') html(`<div class="card">
      <div class="display wordmark c-name rise" ${d(0.2)}>${mark} Regista</div>
      <div class="display c-tag wipe" ${d(0.7)}>Reads the game. <span>Directs the broadcast.</span></div>
      <div class="c-links">
        <div class="rise" ${d(1.4)}><em>Try it</em> gtf-app.delightfulbush-9c2f92ce.italynorth.azurecontainerapps.io</div>
        <div class="rise" ${d(1.7)}><em>Code</em> github.com/lorenzogalli-dev/regista</div>
      </div>
      <div class="c-by rise" ${d(2.2)}>Lorenzo Galli · MSc student, KTH Royal Institute of Technology · All clubs, players and data are synthetic.</div>
    </div>`)
  if (sub) html(`<div class="sub">${sub.replace(/</g, '&lt;')}</div>`)
  if (tag) html(`<div class="tag ${q.get('kind') === 'ai' ? 'ai' : ''}"><span>${tag.replace(/</g, '&lt;')}</span></div>`)
</script>
</body>
</html>
