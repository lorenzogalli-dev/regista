[project]
name = "ground-truth-football"
version = "0.1.0"
description = "Multi-agent, verifiable match intelligence over synthetic football data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.3",
    "uvicorn[standard]>=0.54.0",
    "psycopg[binary]>=3.3.6",
    "numpy>=2.5.4",
    "websockets>=17.2",
    "pydantic>=2.14.1",
    "mcp>=1.30.0,<2",
]

[project.scripts]
sim = "sim.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sim", "metrics", "agents", "api", "eval"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
packages = ["sim", "metrics", "api", "eval"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["sim.*", "metrics.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a running PostgreSQL (DATABASE_URL)",
    "slow: simulates many full matches (run in the separate CI job)",
    "crossplatform: compares a digest recorded on another platform",
]
addopts = "-m 'not slow and not crossplatform'"
